<!-- Search Modal -->
<div id="search-modal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.55);backdrop-filter:blur(3px);">
  <div style="max-width:620px;margin:12vh auto;padding:0 1rem;" onclick="event.stopPropagation()">
    <div style="background:var(--entry);border-radius:12px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,0.5);">
      <div style="display:flex;align-items:center;gap:0.75rem;padding:1rem 1.25rem;border-bottom:1px solid var(--border);">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="var(--secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="modal-search-input" type="text" placeholder="Search..." autocomplete="off"
          style="flex:1;background:transparent;border:none;outline:none;font-size:1rem;color:var(--primary);">
        <kbd style="font-size:0.7rem;padding:2px 6px;border:1px solid var(--secondary);border-radius:4px;color:var(--secondary);white-space:nowrap;">Esc</kbd>
      </div>
      <ul id="modal-search-results" style="list-style:none;margin:0;padding:0.5rem;max-height:420px;overflow-y:auto;"></ul>
    </div>
  </div>
</div>

<script>
(function () {
  const modal = document.getElementById('search-modal');
  const input = document.getElementById('modal-search-input');
  const resultsList = document.getElementById('modal-search-results');
  const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform);

  let fuse = null;

  async function initSearch() {
    if (fuse) return;
    if (typeof Fuse === 'undefined') {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/fuse.js@7/dist/fuse.basic.min.js';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    const res = await fetch('/index.json');
    const data = await res.json();
    fuse = new Fuse(data, {
      keys: ['title', 'summary', 'content'],
      threshold: 0.4,
      includeScore: true,
    });
  }

  function openModal() {
    modal.style.display = 'block';
    document.body.style.overflow = 'hidden';
    initSearch().then(() => input.focus());
    input.focus();
  }

  function closeModal() {
    modal.style.display = 'none';
    document.body.style.overflow = '';
    input.value = '';
    resultsList.innerHTML = '';
  }

  // Cmd+k / Ctrl+k to open; Escape to close
  document.addEventListener('keydown', function (e) {
    if ((isMac ? e.metaKey : e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      modal.style.display === 'none' ? openModal() : closeModal();
    }
    if (e.key === 'Escape') closeModal();
  });

  // Close on backdrop click
  modal.addEventListener('click', closeModal);

  // Live search
  input.addEventListener('input', function () {
    if (!fuse) return;
    const query = this.value.trim();
    if (!query) { resultsList.innerHTML = ''; return; }

    const hits = fuse.search(query).slice(0, 8);
    resultsList.innerHTML = hits.map(({ item }) => `
      <li>
        <a href="${item.permalink}"
          style="display:block;padding:0.65rem 0.75rem;border-radius:8px;text-decoration:none;color:var(--primary);"
          onmouseover="this.style.background='var(--code-bg)'" onmouseout="this.style.background=''">
          <div style="font-size:0.95rem;font-weight:500;">${item.title}</div>
          ${item.summary ? `<div style="font-size:0.8rem;color:var(--secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.summary}</div>` : ''}
        </a>
      </li>
    `).join('');
  });

  // Set kbd label in nav button
  const kbd = document.getElementById('search-kbd');
  if (kbd) kbd.textContent = isMac ? '⌘k' : 'Ctrl+k';
})();
</script>
